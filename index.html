<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<title>Mega Tribu Hispana · Portal Oficial</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#05040a;--gold:#f2c14e;--gold2:#fff3c4;--violet:#8b45ff;--teal:#19d3e0;--txt:#f5efe0;--mut:#b7adc9}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
  body{min-height:100vh}

  /* ===== Fondo vivo: imagen propia + aurora + reflectores ===== */
  .bgimg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(90% 55% at 50% 110%,#06343a 0%,transparent 70%),
               radial-gradient(70% 40% at 50% -10%,#1b1a1f 0%,transparent 70%),
               linear-gradient(180deg,#0b0c10 0%,#050608 55%,#03161a 100%)}
  .edge{position:fixed;top:0;bottom:0;width:2px;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(242,193,78,.9) 30%,rgba(25,211,224,.8) 70%,transparent);
    background-size:100% 200%;animation:edge 6s linear infinite;opacity:.7}
  .edge.l{left:10px}.edge.r{right:10px;animation-direction:reverse}
  @keyframes edge{0%{background-position:0 0}100%{background-position:0 200%}}
  @keyframes kb{0%{transform:scale(1.15) translate(0,0)}50%{transform:scale(1.3) translate(-3%,2%)}100%{transform:scale(1.2) translate(3%,-2%)}}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
  .aurora i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.55}
  .aurora i:nth-child(1){background:#c98a12;opacity:.32;top:-30vmax;left:-20vmax;animation:a1 16s ease-in-out infinite alternate}
  .aurora i:nth-child(2){background:#0a8fa0;bottom:-35vmax;right:-25vmax;opacity:.22;animation:a2 19s ease-in-out infinite alternate}
  .aurora i:nth-child(3){background:#ffb020;top:30%;left:40%;width:45vmax;height:45vmax;opacity:.16;animation:a3 13s ease-in-out infinite alternate}
  .aurora i:nth-child(4){display:none;animation:a1 22s ease-in-out infinite alternate-reverse}
  @keyframes a1{to{transform:translate(25vw,20vh) scale(1.2)}}
  @keyframes a2{to{transform:translate(-30vw,-25vh) scale(1.15)}}
  @keyframes a3{to{transform:translate(-35vw,25vh) scale(.8)}}
  .vig{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 40%,transparent 35%,rgba(0,0,0,.92) 100%),
               linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.65))}
  .spot{position:fixed;top:-25vh;width:34vw;min-width:200px;height:140vh;z-index:0;pointer-events:none;
    clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(5px);mix-blend-mode:screen}
  .spot.l{left:2vw;background:linear-gradient(180deg,rgba(255,215,120,.6),rgba(255,215,120,.08) 60%,transparent 85%);
    transform-origin:50% 0;animation:swL 6s ease-in-out infinite}
  .spot.r{right:2vw;background:linear-gradient(180deg,rgba(255,215,120,.6),rgba(255,215,120,.08) 60%,transparent 85%);
    transform-origin:50% 0;animation:swR 6s ease-in-out infinite}
  .spot.c1{left:30vw;background:linear-gradient(180deg,rgba(255,215,120,.28),transparent 75%);
    transform-origin:50% 0;animation:swR 9s ease-in-out infinite}
  .spot.c2{right:30vw;background:linear-gradient(180deg,rgba(255,215,120,.28),transparent 75%);
    transform-origin:50% 0;animation:swL 9s ease-in-out infinite}
  @keyframes swL{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(8deg)}}
  @keyframes swR{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-8deg)}}

  .grid{position:fixed;inset:-50%;z-index:0;pointer-events:none;opacity:.18;
    background-image:linear-gradient(rgba(242,193,78,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(242,193,78,.35) 1px,transparent 1px);
    background-size:44px 44px;transform:perspective(600px) rotateX(58deg) translateY(10%);
    -webkit-mask-image:radial-gradient(60% 50% at 50% 60%,#000,transparent 75%);mask-image:radial-gradient(60% 50% at 50% 60%,#000,transparent 75%);
    animation:gridmove 14s linear infinite}
  @keyframes gridmove{to{background-position:0 44px,0 0}}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  /* Paneles de vidrio */
  .glass{position:relative;padding:14px;border-radius:22px;
    background:transparent;border:0;box-shadow:none;
    
    box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,240,200,.12)}
  .glass+.glass{margin-top:16px}

  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;
    padding:calc(14px + env(safe-area-inset-top)) 34px calc(36px + env(safe-area-inset-bottom))}

  /* ===== Piezas de imagen ===== */
  .pic{position:relative;display:block;overflow:hidden;cursor:pointer;
    border:1.5px solid rgba(242,193,78,.75);
    box-shadow:0 0 18px rgba(242,193,78,.28),0 0 40px rgba(0,0,0,.22);
    transition:transform .18s ease,box-shadow .18s ease}
  .pic img{display:block;width:100%;height:auto}
  .pic::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,240,190,.38),transparent);
    transform:skewX(-18deg);animation:shine 5.5s ease-in-out infinite;pointer-events:none}
  .pic:hover,.pic:focus-visible{box-shadow:0 0 26px rgba(242,193,78,.55),0 0 60px rgba(0,0,0,.35);outline:none}
  .pic:active{transform:scale(.975)}
  @keyframes shine{0%,70%{left:-60%}100%{left:130%}}

  .hero{border-radius:18px;cursor:default;animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(242,193,78,.3),0 0 40px rgba(0,0,0,.25)}
                   50%{box-shadow:0 0 30px rgba(242,193,78,.6),0 0 70px rgba(0,0,0,.45)}}
  .en{display:block;text-align:center;color:var(--mut);font-size:11.5px;letter-spacing:.3px;margin-top:7px}

  .title{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px 0 12px;
    font-weight:900;letter-spacing:4px;font-size:18px;
    background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a8761f);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .title::before,.title::after{content:"";flex:1;max-width:90px;height:1.5px;
    background:linear-gradient(90deg,transparent,var(--gold))}
  .title::after{background:linear-gradient(270deg,transparent,var(--gold))}

  .cards{display:grid;gap:16px}
  .card{border-radius:16px}
  .btns{display:grid;gap:10px;margin-top:18px}
  .btn{border-radius:999px}
  .btn.soon{cursor:default;filter:saturate(.9)}
  .btn.soon:active{transform:none}

  footer{text-align:center;color:var(--mut);font-size:11px;margin-top:26px;line-height:1.7}
  footer b{color:var(--gold)}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:5;
    transform:translate(-50%,30px);opacity:0;transition:.25s;
    background:#0d0a16;border:1px solid var(--gold);color:var(--txt);
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;
    box-shadow:0 0 24px rgba(242,193,78,.35)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast small{display:block;font-weight:500;color:var(--mut);font-size:11px;text-align:center}

  /* ===== Jerarquía: portal grande, mini apps medianas, botones chicos ===== */
  .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .glass{padding:0;background:none;border:0;box-shadow:none}
  .glass+.glass{margin-top:6px}
  .wrap{max-width:1180px;padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom))}
  .title{margin:16px 0 10px;font-size:15px}
  .cards{gap:12px}
  .card+.en,.cards .en{font-size:11px;margin-top:4px}
  .btns{gap:8px;margin-top:14px}
  footer{margin-top:16px}
  @media (min-width:600px){
    .wrap{padding-left:20px;padding-right:20px}
    .cards{grid-template-columns:1fr 1fr;gap:14px}
    .btns{grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}
  }
  @media (min-width:1000px){
    .wrap{padding-top:24px}
    .title{font-size:20px;margin:22px 0 14px}
    .cards{gap:22px}
    .btns{gap:12px 22px}
  }
  @media (prefers-reduced-motion:reduce){
    .pic::after,.hero,.bgimg,.edge,.aurora i,.grid{animation:none}
  }
</style>
</head>
<body>
<div class="bgimg"></div><div class="edge l"></div><div class="edge r"></div>

<main class="wrap">

  <section class="glass">
  <div class="pic hero">
    <img src="img/portal.jpg" alt="Mega Tribu Hispana · Portal oficial · +18 · Unirte es gratis · Todo depende de ti" width="1600" height="640" fetchpriority="high">
  </div>
  <span class="en">Joining is free · It all depends on you</span>
  </section>

  <section class="glass">
  <div class="title" style="margin-top:4px">MINI APPS</div>

  <div class="cards">
    <div>
      <a class="pic card" data-go="megatribu" aria-label="Abrir Mega Tribu Hispana">
        <img src="img/megatribu.jpg" alt="Mega Tribu Hispana · Alianzas que cruzan fronteras" width="1500" height="500" loading="lazy">
      </a>
      <span class="en">Community · Alliances · Dream Team</span>
    </div>
    <div>
      <a class="pic card" data-go="poseidon" aria-label="Abrir Poseidón Oceanus">
        <img src="img/poseidon.jpg" alt="Poseidón Oceanus · Planes VIP · Telegram Stars" width="1500" height="500" loading="lazy">
      </a>
      <span class="en">VIP plans · Telegram Stars</span>
    </div>
  </div>

  <div class="btns">
    <a class="pic btn soon" data-go="pronto" aria-label="Más mini apps pronto"><img src="img/btn-pronto.jpg" alt="Más mini apps pronto" width="1200" height="98" loading="lazy"></a>
    <a class="pic btn" data-go="canal" aria-label="Canal oficial"><img src="img/btn-canal.jpg" alt="Canal oficial" width="1200" height="98" loading="lazy"></a>
    <a class="pic btn" data-go="grupo" aria-label="Grupo Dream Team"><img src="img/btn-dreamteam.jpg" alt="Grupo Dream Team" width="1200" height="98" loading="lazy"></a>
    <a class="pic btn" data-go="vip" aria-label="Planes VIP"><img src="img/btn-vip.jpg" alt="Planes VIP" width="1200" height="98" loading="lazy"></a>
  </div>

  </section>

  <footer>
    © <b>Mega Tribu Hispana</b> · Zeus Imperium<br>
    Solo mayores de 18 años · Adults only
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — solo se edita esta parte
   ============================================================ */
const CONFIG = {
  POSEIDON_BOT: "",   // usuario del bot de cobro, SIN @
  LINKS: {
    megatribu: "https://oceaunposeidon-bot.github.io/MEGA-TRIBU-HISPANA-MINI-APP-OFICIAL/",
    poseidon:  "https://oceaunposeidon-bot.github.io/POSEIDON-OCEANUS-MINI-APP-OFICIAL/",
    canal:     "https://t.me/MegaTribuHispana",
    grupo:     ""     // enlace del grupo Dream Team (t.me/...)
  }
};
/* ============================================================ */

const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
const enTelegram = !!(tg && tg.initData);
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor("#05040a"); tg.setBackgroundColor("#05040a"); tg.BackButton.hide(); } catch(e){}
}

const toastEl = document.getElementById("toast");
let tt;
function toast(es, en){
  toastEl.innerHTML = es + "<small>" + en + "</small>";
  toastEl.classList.add("on"); clearTimeout(tt);
  tt = setTimeout(() => toastEl.classList.remove("on"), 2200);
}
function vibrar(){ try { tg && tg.HapticFeedback.impactOccurred("light"); } catch(e){} }

function abrir(url){
  if (!url) { toast("✨ Muy pronto", "Coming soon"); return; }
  if (url.startsWith("https://t.me/")) {
    enTelegram ? tg.openTelegramLink(url) : window.open(url, "_blank", "noopener");
  } else {
    window.location.href = url;
  }
}

const destinos = {
  megatribu: () => abrir(CONFIG.LINKS.megatribu),
  poseidon:  () => abrir(CONFIG.LINKS.poseidon),
  canal:     () => abrir(CONFIG.LINKS.canal),
  grupo:     () => abrir(CONFIG.LINKS.grupo),
  vip:       () => abrir(CONFIG.POSEIDON_BOT ? "https://t.me/" + CONFIG.POSEIDON_BOT + "?start=vip" : CONFIG.LINKS.poseidon),
  pronto:    () => toast("✨ Más mini apps muy pronto", "More mini apps coming soon")
};
document.querySelectorAll("[data-go]").forEach(el => {
  el.setAttribute("role", "button"); el.tabIndex = 0;
  const go = () => { vibrar(); destinos[el.dataset.go](); };
  el.addEventListener("click", go);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
});

</script>
</body>
</html>
